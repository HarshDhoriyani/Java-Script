    // Write a function that when u click any image that image should be vanished from the page(we have remove complete li of that image).
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName);
        
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode;
            removeIt.remove();  // Method 1

        }
        
        // removeIt.parentNode.removeChild(removeIt);  // Method 2
