<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT & REMOVE ELEMENTS IN DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    // addLanguage('Python');
    // addLanguage('Java');
    // addLanguage('C++');


    <!-- Optimize Method -->
    function addOptiLanguage(langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage('Python');
    addOptiLanguage('Java');

    // Edit Element
    const secondLang = document.querySelector("li:nth-child(2)");
    console.log(secondLang);
    // secondLang.innerHTML = "Mojo"; // Not an optimized way
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo";
    secondLang.replaceWith(newLi); // optimized way

    // Edit Element -> Another Method
    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = "<li>TypeScript</li>"; // not an optimized way

    // remove Element
    const lastlang = document.querySelector("li:last-child");
    lastlang.remove(); 

</script>
</html>
