<!DOCTYPE html>
<html lang="en">

    <style> 
        .bg-black {
            background-color: black;
            color: white;
        }
    </style>
    
</head>
<body class="bg-black">
    <div>
        <h1 id="title" class="heading"> DOM learning on Chai aur Code <span style="display: none;"> Test Text </span></h1>

        <h2> lorem ipsum dolor sit.</h2>

            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>

    <!-- 
    on the webpage we have used two functions : title.innerText and title.textContent.
    title.innerText displays only main text which is visible in the browser.
    whereas title.textContent displays main text as well as the hidden text where style is display: none.
    in this case innerText will display DOM learning on Chai aur Code.
    wherease textContent will display DOM learning on Chai aur Code Test Text.
    -->

    <!--
    title.innerHTML supports HTML tags also. In this case title.innerHTML will display :
    ' DOM learning on Chai aur Code <span style="display: none;"> Test Text </span>'
    -->
